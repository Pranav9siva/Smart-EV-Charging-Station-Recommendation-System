apiVersion: apps/v1
kind: Deployment
metadata:
  name: ev-digital-twin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ev-digital-twin
  template:
    metadata:
      labels:
        app: ev-digital-twin
    spec:
      containers:
        - name: api
          image: ev-digital-twin:latest
          ports:
            - containerPort: 8000
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: ev-digital-twin
spec:
  selector:
    app: ev-digital-twin
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
